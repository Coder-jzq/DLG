<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>英文提词器</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --primary: #e9a7bb;
      --secondary: #d989a5;
      --text: #1f2933;
      --muted: #687385;
      --line: #e9a7bb52;
      --card: #ffffffee;
      --warn: #b7791f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 42px 42px;
      -webkit-mask-image: linear-gradient(to bottom, #0004, transparent);
      mask-image: linear-gradient(to bottom, #0004, transparent);
      pointer-events: none;
    }

    .shell {
      position: relative;
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .panel {
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 20px 80px #e9a7bb26, inset 0 1px 0 #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #f5c6d2);
      box-shadow: 0 0 34px #e9a7bb80;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px 170px 132px;
      gap: 12px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .english-field {
      grid-column: 1 / -1;
    }

    textarea,
    input,
    select,
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff9fb;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 230px;
      resize: vertical;
      padding: 14px;
      line-height: 1.58;
    }

    input,
    select,
    button {
      height: 42px;
      padding: 0 12px;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: #e9a7bbaa;
      box-shadow: 0 0 0 3px #e9a7bb30;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-color: #efb9c9;
      color: #fff;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .stats span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff7fa;
    }

    .stats .warn {
      color: var(--warn);
      border-color: #ffd16666;
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding-top: clamp(18px, 5vh, 54px);
      background: #fff;
    }

    .prompter {
      position: relative;
      width: min(80vw, 1120px);
      min-width: min(60vw, calc(100vw - 24px));
      text-align: left;
    }

    /*
      页面内容由 JS 主动插入换行。
      每页固定 2 行，每行固定 80 个字符。
    */
    .prompt-text {
      min-height: 3.1em;
      margin: 0;
      font-size: clamp(13px, 1.55vw, 20px);
      line-height: 1.55;
      font-weight: 400;
      letter-spacing: 0;
      color: rgb(219 112 147 / 38%);
      white-space: pre;
      overflow: hidden;
    }

    .stage-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .stage-actions button {
      min-width: 132px;
      height: 46px;
    }

    .stage-actions .secondary-button {
      background: #fff9fb;
      color: var(--secondary);
      border-color: #e9a7bb88;
    }

    .mode-tip {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    body.is-playing {
      overflow: hidden;
    }

    body.is-playing .shell {
      display: none;
    }

    body.is-playing .stage {
      display: flex;
    }

    @media (max-width: 760px) {
      .shell {
        width: calc(100% - 20px);
        padding: 16px 0;
      }

      .panel {
        padding: 18px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 260px;
      }

      .stage {
        padding-top: clamp(16px, 4vh, 44px);
      }

      .prompter {
        width: calc(100vw - 24px);
        min-width: 0;
      }

      /*
        小屏幕适当缩小字号，尽量确保 80 字符一行能显示。
      */
      .prompt-text {
        font-size: clamp(10px, 2.1vw, 15px);
      }
    }
  </style>
</head>

<body>

  <main class="shell">
    <section class="panel">

      <div class="brand">
        <span class="mark"></span>

        <div>
          <h1>英文提词器</h1>
          <p>每行 80 字符 / 每页 2 行 / 手动或自动切换</p>
        </div>
      </div>

      <div class="controls">

        <label class="english-field">
          英文段落
          <textarea
            id="sourceText"
            autocomplete="off"
            spellcheck="false"
            placeholder="Paste English text here."
          ></textarea>
        </label>

        <label>
          切换方式
          <select id="switchMode">
            <option value="manual">手动切换</option>
            <option value="auto">自动切换</option>
          </select>
        </label>

        <label>
          自动切换秒数
          <input
            id="autoSeconds"
            type="number"
            min="0.2"
            step="0.1"
            inputmode="decimal"
            autocomplete="off"
            placeholder="例如 5"
            disabled
          >
        </label>

        <button id="startButton" type="button">
          开始提词
        </button>

      </div>

      <div class="stats" aria-live="polite">
        <span id="charStat">等待输入英文</span>
        <span id="timeStat">当前：手动切换</span>
      </div>

    </section>
  </main>


  <section
    class="stage"
    aria-live="off"
    aria-hidden="true"
  >
    <div class="prompter">

      <p class="prompt-text">
        <span id="promptText"></span>
      </p>

      <div class="stage-actions">
        <button id="nextButton" type="button">
          下一页
        </button>

        <button
          id="exitButton"
          class="secondary-button"
          type="button"
        >
          退出
        </button>
      </div>

      <div id="modeTip" class="mode-tip">
        手动模式：点击“下一页”继续
      </div>

    </div>
  </section>


  <script>
    /*
      ============================================
      固定分页参数

      每行 80 个字符
      每页 2 行
      每页共 160 个字符

      如果以后想改：
      例如每行 70 个字符：
      CHARS_PER_LINE = 70

      如果想每页 3 行：
      LINES_PER_PAGE = 3
      ============================================
    */

    const CHARS_PER_LINE = 80;
    const LINES_PER_PAGE = 2;
    const CHARS_PER_PAGE =
      CHARS_PER_LINE * LINES_PER_PAGE;


    /* DOM */

    const sourceText =
      document.getElementById("sourceText");

    const switchMode =
      document.getElementById("switchMode");

    const autoSeconds =
      document.getElementById("autoSeconds");

    const startButton =
      document.getElementById("startButton");

    const charStat =
      document.getElementById("charStat");

    const timeStat =
      document.getElementById("timeStat");

    const stage =
      document.querySelector(".stage");

    const promptText =
      document.getElementById("promptText");

    const nextButton =
      document.getElementById("nextButton");

    const exitButton =
      document.getElementById("exitButton");

    const modeTip =
      document.getElementById("modeTip");


    /* 播放状态 */

    let runId = 0;
    let pages = [];
    let currentIndex = 0;
    let autoTimer = null;


    /*
      清理输入。

      所有换行、Tab、连续空格都变成一个普通空格。

      注意：
      不分析句号，
      不分析逗号，
      不分析单词，
      完全按照字符位置分页。
    */

    function normalizeText(value) {
      return value
        .replace(/\s+/g, " ")
        .trim();
    }


    /*
      把一页的 160 个字符
      强制拆成两行：

      第 1 行：0 ~ 79
      第 2 行：80 ~ 159

      不考虑是不是完整单词。
    */

    function formatPage(pageText) {
      const lines = [];

      for (
        let index = 0;
        index < pageText.length;
        index += CHARS_PER_LINE
      ) {
        lines.push(
          pageText.slice(
            index,
            index + CHARS_PER_LINE
          )
        );
      }

      return lines.join("\n");
    }


    /*
      按固定字符数分页。

      每页 160 个字符。

      例如：
      第 1 页：0 ~ 159
      第 2 页：160 ~ 319
      第 3 页：320 ~ 479
      ...
    */

    function buildPages(value) {
      const text =
        normalizeText(value);

      const result = [];

      for (
        let index = 0;
        index < text.length;
        index += CHARS_PER_PAGE
      ) {
        const pageText =
          text.slice(
            index,
            index + CHARS_PER_PAGE
          );

        result.push(
          formatPage(pageText)
        );
      }

      return result;
    }


    /*
      清除自动切换计时器
    */

    function clearAutoTimer() {
      if (autoTimer !== null) {
        window.clearTimeout(autoTimer);
        autoTimer = null;
      }
    }


    /*
      更新首页统计信息
    */

    function updateStats() {
      const text =
        normalizeText(
          sourceText.value
        );

      const mode =
        switchMode.value;

      const seconds =
        Number(
          autoSeconds.value
        );

      const pageCount =
        text.length
          ? Math.ceil(
              text.length /
              CHARS_PER_PAGE
            )
          : 0;


      charStat.textContent =
        text.length
          ? `${text.length} 字符 / ${pageCount} 页 / 每页最多 ${CHARS_PER_PAGE} 字符`
          : "等待输入英文";


      timeStat.classList.remove(
        "warn"
      );


      if (mode === "manual") {
        timeStat.textContent =
          "当前：手动切换";
      }

      else if (
        !Number.isFinite(seconds)
        ||
        seconds <= 0
      ) {
        timeStat.textContent =
          "请输入有效自动切换秒数";

        timeStat.classList.add(
          "warn"
        );
      }

      else {
        timeStat.textContent =
          `当前：每 ${seconds}s 自动切换`;
      }
    }


    /*
      设置提词状态
    */

    function setPlaying(isPlaying) {
      document.body.classList.toggle(
        "is-playing",
        isPlaying
      );

      stage.setAttribute(
        "aria-hidden",
        String(!isPlaying)
      );

      startButton.disabled =
        isPlaying;
    }


    /*
      退出
    */

    function stopPrompter() {
      runId += 1;

      clearAutoTimer();

      setPlaying(false);

      promptText.textContent = "";

      pages = [];

      currentIndex = 0;

      nextButton.disabled = false;

      updateStats();
    }


    /*
      所有内容结束
    */

    function finishPrompter() {
      clearAutoTimer();

      promptText.textContent =
        "已完成";

      nextButton.disabled =
        true;

      modeTip.textContent =
        "全部内容已完成，点击“退出”返回。";
    }


    /*
      自动模式下，
      当前页面显示指定秒数后切换
    */

    function scheduleNext(id) {
      clearAutoTimer();

      if (
        switchMode.value !== "auto"
      ) {
        return;
      }

      const seconds =
        Number(
          autoSeconds.value
        );

      if (
        !Number.isFinite(seconds)
        ||
        seconds <= 0
      ) {
        return;
      }

      autoTimer =
        window.setTimeout(
          () => {
            if (
              runId === id
              &&
              document.body.classList.contains(
                "is-playing"
              )
            ) {
              showNextPage(id);
            }
          },
          seconds * 1000
        );
    }


    /*
      显示当前页
    */

    function showCurrentPage(id) {
      if (
        runId !== id
        ||
        !pages.length
      ) {
        return;
      }

      if (
        currentIndex >=
        pages.length
      ) {
        finishPrompter();
        return;
      }

      promptText.textContent =
        pages[currentIndex];

      nextButton.disabled =
        false;


      if (
        switchMode.value ===
        "auto"
      ) {
        const seconds =
          Number(
            autoSeconds.value
          );

        modeTip.textContent =
          `第 ${currentIndex + 1}/${pages.length} 页 · ${seconds}s 后自动切换 · 也可手动点击“下一页”`;
      }

      else {
        modeTip.textContent =
          `第 ${currentIndex + 1}/${pages.length} 页 · 手动模式 · 点击“下一页”继续`;
      }

      scheduleNext(id);
    }


    /*
      下一页
    */

    function showNextPage(
      id = runId
    ) {
      if (
        !document.body.classList.contains(
          "is-playing"
        )
      ) {
        return;
      }

      clearAutoTimer();

      currentIndex += 1;

      showCurrentPage(id);
    }


    /*
      开始提词
    */

    function startPrompter() {
      const text =
        normalizeText(
          sourceText.value
        );

      const mode =
        switchMode.value;

      const seconds =
        Number(
          autoSeconds.value
        );


      if (!text.length) {
        charStat.textContent =
          "请先输入英文段落";

        return;
      }


      if (
        mode === "auto"
        &&
        (
          !Number.isFinite(seconds)
          ||
          seconds <= 0
        )
      ) {
        timeStat.textContent =
          "请填写有效自动切换秒数";

        timeStat.classList.add(
          "warn"
        );

        return;
      }


      const id =
        ++runId;


      /*
        核心：
        直接按每页 160 个字符切。
      */

      pages =
        buildPages(text);


      currentIndex = 0;

      promptText.textContent = "";

      nextButton.disabled = false;

      setPlaying(true);

      showCurrentPage(id);
    }


    /* 输入文字 */

    sourceText.addEventListener(
      "input",
      updateStats
    );


    /* 自动切换秒数 */

    autoSeconds.addEventListener(
      "input",
      updateStats
    );


    /*
      手动 / 自动切换
    */

    switchMode.addEventListener(
      "change",
      () => {
        const isAuto =
          switchMode.value ===
          "auto";

        autoSeconds.disabled =
          !isAuto;

        if (
          isAuto
          &&
          !autoSeconds.value
        ) {
          autoSeconds.value =
            "5";
        }

        updateStats();
      }
    );


    /* 开始按钮 */

    startButton.addEventListener(
      "click",
      startPrompter
    );


    /* 下一页按钮 */

    nextButton.addEventListener(
      "click",
      () => {
        showNextPage(runId);
      }
    );


    /* 退出按钮 */

    exitButton.addEventListener(
      "click",
      stopPrompter
    );


    /*
      键盘快捷键：

      Esc：
      退出

      →
      Space：
      下一页
    */

    document.addEventListener(
      "keydown",
      event => {
        if (
          !document.body.classList.contains(
            "is-playing"
          )
        ) {
          return;
        }

        if (
          event.key ===
          "Escape"
        ) {
          stopPrompter();
        }

        else if (
          event.key ===
          "ArrowRight"
          ||
          event.key ===
          " "
        ) {
          event.preventDefault();

          showNextPage(
            runId
          );
        }
      }
    );


    /* 初始化 */

    updateStats();

  </script>

</body>
</html>
