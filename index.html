<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>英文提词器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --primary: #e9a7bb;
      --secondary: #d989a5;
      --text: #1f2933;
      --muted: #687385;
      --line: #e9a7bb52;
      --card: #ffffffee;
      --warn: #b7791f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 42px 42px;
      -webkit-mask-image: linear-gradient(to bottom, #0004, transparent);
      mask-image: linear-gradient(to bottom, #0004, transparent);
      pointer-events: none;
    }

    .shell {
      position: relative;
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .panel {
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 20px 80px #e9a7bb26, inset 0 1px 0 #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #f5c6d2);
      box-shadow: 0 0 34px #e9a7bb80;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px 170px 132px;
      gap: 12px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .english-field {
      grid-column: 1 / -1;
    }

    textarea,
    input,
    select,
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff9fb;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 230px;
      resize: vertical;
      padding: 14px;
      line-height: 1.58;
    }

    input,
    select,
    button {
      height: 42px;
      padding: 0 12px;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: #e9a7bbaa;
      box-shadow: 0 0 0 3px #e9a7bb30;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-color: #efb9c9;
      color: #fff;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .stats span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff7fa;
    }

    .stats .warn {
      color: var(--warn);
      border-color: #ffd16666;
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding-top: clamp(18px, 5vh, 54px);
      background: #fff;
    }

    .prompter {
      position: relative;
      width: min(80vw, 1120px);
      min-width: min(60vw, calc(100vw - 24px));
      text-align: left;
    }

    .stage-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .stage-actions button {
      min-width: 132px;
      height: 46px;
    }

    .stage-actions .secondary-button {
      background: #fff9fb;
      color: var(--secondary);
      border-color: #e9a7bb88;
    }

    .mode-tip {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .prompt-text {
      min-height: 3.1em;
      margin: 0;
      font-size: clamp(13px, 1.55vw, 20px);
      line-height: 1.55;
      font-weight: 400;
      letter-spacing: 0;
      color: rgb(219 112 147 / 38%);
      overflow: hidden;
      white-space: pre;
    }

    .cursor {
      display: none;
      width: 0.08em;
      height: 0.94em;
      margin-left: 0.08em;
      border-radius: 999px;
      background: #e9a7bb;
      vertical-align: -0.1em;
      box-shadow: 0 0 18px #e9a7bbcc;
      animation: blink 0.86s step-end infinite;
    }

    body.is-playing {
      overflow: hidden;
    }

    body.is-playing .shell {
      display: none;
    }

    body.is-playing .stage {
      display: flex;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: calc(100% - 20px);
        padding: 16px 0;
      }

      .panel {
        padding: 18px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 260px;
      }

      .stage {
        padding-top: clamp(16px, 4vh, 44px);
      }

      .prompter {
        width: calc(100vw - 24px);
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="brand">
        <span class="mark"></span>
        <div>
          <h1>英文提词器</h1>
          <p>两句一组 / 手动或自动切换</p>
        </div>
      </div>

      <div class="controls">
        <label class="english-field">
          英文段落
          <textarea id="sourceText" autocomplete="off" spellcheck="false" placeholder="Paste English text here. Each sentence should end with a period."></textarea>
        </label>
        <label>
          切换方式
          <select id="switchMode">
            <option value="manual">手动切换</option>
            <option value="auto">自动切换</option>
          </select>
        </label>
        <label>
          自动切换秒数
          <input id="autoSeconds" type="number" min="0.2" step="0.1" inputmode="decimal" autocomplete="off" placeholder="例如 5" disabled>
        </label>
        <button id="startButton" type="button">开始提词</button>
      </div>

      <div class="stats" aria-live="polite">
        <span id="sentenceStat">等待输入英文</span>
        <span id="timeStat">当前：手动切换</span>
      </div>
    </section>
  </main>

  <section class="stage" aria-live="off" aria-hidden="true">
    <div class="prompter">
      <p class="prompt-text"><span id="promptText"></span><span class="cursor" aria-hidden="true"></span></p>
      <div class="stage-actions">
        <button id="nextButton" type="button">下一句</button>
        <button id="exitButton" class="secondary-button" type="button">退出</button>
      </div>
      <div id="modeTip" class="mode-tip">手动模式：点击“下一句”继续</div>
    </div>
  </section>

  <script>
    const sourceText = document.getElementById("sourceText");
    const switchMode = document.getElementById("switchMode");
    const autoSeconds = document.getElementById("autoSeconds");
    const startButton = document.getElementById("startButton");
    const sentenceStat = document.getElementById("sentenceStat");
    const timeStat = document.getElementById("timeStat");
    const stage = document.querySelector(".stage");
    const promptText = document.getElementById("promptText");
    const nextButton = document.getElementById("nextButton");
    const exitButton = document.getElementById("exitButton");
    const modeTip = document.getElementById("modeTip");

    let runId = 0;
    let groups = [];
    let currentIndex = 0;
    let autoTimer = null;

    function splitSentences(value) {
      return value
        .replace(/\s+/g, " ")
        .split(".")
        .map(part => part.trim())
        .filter(Boolean)
        .map(part => `${part}.`);
    }

    function groupSentences(sentences) {
      const groups = [];
      for (let index = 0; index < sentences.length; index += 2) {
        groups.push(sentences.slice(index, index + 2));
      }
      return groups;
    }

    function clearAutoTimer() {
      if (autoTimer !== null) {
        window.clearTimeout(autoTimer);
        autoTimer = null;
      }
    }

    function updateStats() {
      const sentences = splitSentences(sourceText.value);
      const mode = switchMode.value;
      const seconds = Number(autoSeconds.value);

      sentenceStat.textContent = sentences.length
        ? `${sentences.length} 句 / ${groupSentences(sentences).length} 组`
        : "等待输入英文";

      timeStat.classList.remove("warn");

      if (mode === "manual") {
        timeStat.textContent = "当前：手动切换";
      } else if (!Number.isFinite(seconds) || seconds <= 0) {
        timeStat.textContent = "请输入有效自动切换秒数";
        timeStat.classList.add("warn");
      } else {
        timeStat.textContent = `当前：每 ${seconds}s 自动切换`;
      }
    }

    function setPlaying(isPlaying) {
      document.body.classList.toggle("is-playing", isPlaying);
      stage.setAttribute("aria-hidden", String(!isPlaying));
      startButton.disabled = isPlaying;
    }

    function stopPrompter() {
      runId += 1;
      clearAutoTimer();
      setPlaying(false);
      promptText.textContent = "";
      groups = [];
      currentIndex = 0;
      updateStats();
    }

    function finishPrompter() {
      clearAutoTimer();
      promptText.textContent = "已完成";
      nextButton.disabled = true;
      modeTip.textContent = "全部内容已完成，点击“退出”返回。";
    }

    function scheduleNext(id) {
      clearAutoTimer();
      if (switchMode.value !== "auto") return;

      const seconds = Number(autoSeconds.value);
      if (!Number.isFinite(seconds) || seconds <= 0) return;

      autoTimer = window.setTimeout(() => {
        if (runId === id && document.body.classList.contains("is-playing")) {
          showNextGroup(id);
        }
      }, seconds * 1000);
    }

    function showCurrentGroup(id) {
      if (runId !== id || !groups.length) return;

      if (currentIndex >= groups.length) {
        finishPrompter();
        return;
      }

      promptText.textContent = groups[currentIndex].join("\n");
      nextButton.disabled = false;

      if (switchMode.value === "auto") {
        const seconds = Number(autoSeconds.value);
        modeTip.textContent = `自动模式：${seconds}s 后切换，也可点击“下一句”立即切换`;
      } else {
        modeTip.textContent = "手动模式：点击“下一句”继续";
      }

      scheduleNext(id);
    }

    function showNextGroup(id = runId) {
      if (!document.body.classList.contains("is-playing")) return;
      clearAutoTimer();
      currentIndex += 1;
      showCurrentGroup(id);
    }

    function startPrompter() {
      const sentences = splitSentences(sourceText.value);
      const mode = switchMode.value;
      const seconds = Number(autoSeconds.value);

      if (!sentences.length) {
        sentenceStat.textContent = "请先输入英文段落";
        return;
      }

      if (mode === "auto" && (!Number.isFinite(seconds) || seconds <= 0)) {
        timeStat.textContent = "请填写有效自动切换秒数";
        timeStat.classList.add("warn");
        return;
      }

      const id = ++runId;
      groups = groupSentences(sentences);
      currentIndex = 0;
      promptText.textContent = "";
      nextButton.disabled = false;
      setPlaying(true);
      showCurrentGroup(id);
    }

    sourceText.addEventListener("input", updateStats);
    autoSeconds.addEventListener("input", updateStats);

    switchMode.addEventListener("change", () => {
      const isAuto = switchMode.value === "auto";
      autoSeconds.disabled = !isAuto;
      if (isAuto && !autoSeconds.value) autoSeconds.value = "5";
      updateStats();
    });

    startButton.addEventListener("click", startPrompter);
    nextButton.addEventListener("click", () => showNextGroup(runId));
    exitButton.addEventListener("click", stopPrompter);

    document.addEventListener("keydown", event => {
      if (!document.body.classList.contains("is-playing")) return;

      if (event.key === "Escape") {
        stopPrompter();
      } else if (event.key === "ArrowRight" || event.key === " ") {
        event.preventDefault();
        showNextGroup(runId);
      }
    });

    updateStats();
  </script>
</body>
</html>
